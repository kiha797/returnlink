function resolvePurchase(source,gtin,lot,serial){const productRows=source.filter(r=>r.gtin.padStart(14,'0')===gtin);if(serial){const serialRows=productRows.filter(r=>r.serial===serial&&(!lot||r.lot===lot));if(serialRows.length)return {rows:serialRows,mode:'serial',fallback:false}}if(lot)return {rows:productRows.filter(r=>r.lot===lot),mode:'lot',fallback:!!serial};if(!serial)return {rows:productRows,mode:'product',fallback:false};return {rows:[],mode:'serial',fallback:false}}
function lookup(demo=false,example='',automatic=false){const code=$('#gtin').value.trim(),gtin=code.padStart(14,'0'),lot=$('#lot').value.trim(),serial=$('#serial').value.trim();if(!/^(?:\d{8}|\d{12,14})$/.test(code)){toast('유효한 상품 바코드 번호를 확인하세요.');return false}let source=imports;if(demo)source=example==='none'?[]:[{product:'시연정 10mg · 30정',vendor:'동원약품',date:'2026-09-24',qty:'10',gtin,lot,serial:example==='serial'?serial:'DW0000001025'},{product:'시연정 10mg · 30정',vendor:'동원아이팜',date:'2026-09-12',qty:'5',gtin,lot,serial:''},{product:'시연정 10mg · 30정',vendor:'아이팜코리아',date:'2026-08-29',qty:'4',gtin,lot,serial:''}];let matched=resolvePurchase(source,gtin,lot,serial);if(!demo&&!matched.rows.length){matched=resolvePurchase(barcodeDemoPurchases,gtin,lot,serial);if(matched.rows.length)demo=true}mode=matched.mode;result={gtin,lot:lot||(matched.mode==='serial'?matched.rows[0]?.lot:'')||'',serial,expiry:$('#expiry').value,rows:matched.rows,demo,fallback:matched.fallback};selected='';const count=new Set(result.rows.map(r=>r.vendor)).size;history.unshift({date:new Date().toLocaleString('ko-KR'),gtin,lot:result.lot,serial,count,mode});history=history.slice(0,100);save();$('#results').innerHTML=isMobile()?mobileResultView():resultView();if(automatic){cameraMessage('바코드 인식 완료 · '+(count? (mode==='serial'?'일련번호 매입처 ':mode==='lot'?'제조번호 후보 ':'상품코드 후보 ')+count+'곳 확인':'일치 매입기록 없음'),'다음 바코드를 비춰주세요')};if(automatic)scanCompleteFeedback();showScanOverlay();return true}
function resultView(){if(!result)return '';const vendors=[...new Set(result.rows.map(r=>r.vendor))],exact=mode==='serial'&&vendors.length===1;return `<div class="card"><div class="sectiontitle"><h2>조회 결과 <span class="muted">${vendors.length}곳</span></h2><span class="badge ${exact?'':'amber'}">${result.demo?'시연 데이터 · ':''}${!vendors.length?'일치 내역 없음':exact?'일련번호 매입기록 일치':mode==='lot'?'제조번호 후보':mode==='product'?'상품코드 후보':'매입기록 충돌 · 확인 필요'}</span></div><div class="product"><h3>${esc(result.rows[0]?.product||'조회한 의약품')}</h3><div class="flex small muted"><span>상품코드 ${esc(result.gtin)}</span><span>제조번호 ${esc(result.lot||'미포함')}</span><span>일련번호 ${esc(result.serial||'미입력')}</span></div></div>${result.fallback?'<div class="infobox" style="margin-bottom:16px">일련번호 매입기록을 찾지 못해 제조번호로 조회했습니다.</div>':''}${vendors.length?`${!exact?'<div class="infobox warn" style="margin-bottom:18px">후보만으로 매입처나 반품 가능 여부가 확정되지 않습니다. 제조번호가 없으면 상품코드의 전체 매입처가 표시됩니다. 공급내역을 확인하고 선택하세요.</div>':''}${vendors.map(v=>`<div class="resultrow"><input aria-label="${esc(v)} 선택" type="radio" name="vendor" value="${esc(v)}" onchange="selected=this.value;document.querySelector('#register').disabled=false"><label onclick="this.previousElementSibling.click()"><b>${esc(v)}</b> <span class="badge ${exact?'':'amber'}">${exact?'매입기록 일치':'선택 후보'}</span>${result.rows.filter(r=>r.vendor===v).map(r=>`<p>공급일자 ${esc(r.date)} · 매입수량 ${esc(r.qty)}개</p>`).join('')}</label></div>`).join('')}<div class="actionbar"><button class="primary" id="register" disabled onclick="registerDialog()">선택한 매입처로 반품 등록</button></div>`:'<div class="empty">일치하는 매입기록을 찾지 못했습니다.<br><br>번호를 확인하거나, 매입내역을 가져온 뒤 다시 조회하세요.</div><div class="flex"><button onclick="nav(\'connect\')">매입내역 가져오기</button></div>'}</div>`}
function registerDialog(){if(!selected)return;$('#modal').innerHTML=`<div class="dialog"><div class="card"><div class="sectiontitle"><h2>반품 등록</h2><button aria-label="닫기" onclick="closeModal()">×</button></div><span class="badge">${esc(selected)}</span><p><b>${esc(result.rows[0]?.product)}</b><br><span class="small muted">제조번호 ${esc(result.lot||'미포함')}</span></p><form onsubmit="event.preventDefault();registerReturn()"><label>반품 수량 (개)</label><input type="number" id="qty" value="1" min="1" max="99999" step="1" required><label>반품 사유</label><select id="reason"><option>유효기한 임박</option><option>재고 조정</option><option>포장 훼손</option><option>오배송</option><option>기타</option></select><label>메모</label><textarea id="memo" rows="2" placeholder="반품 관련 확인사항"></textarea><div class="infobox">현재는 이 브라우저에 반품 목록을 저장합니다. 도매상에 전송되거나 접수되는 것은 아닙니다.</div><div class="actionbar"><button type="button" onclick="closeModal()">취소</button><button class="primary">반품 목록에 저장</button></div></form></div></div>`}
function registerReturn(){const qty=Number($('#qty').value);if(!Number.isInteger(qty)||qty<1)return;if(mode==='serial'&&result.serial&&records.some(r=>r.gtin===result.gtin&&r.serial===result.serial)){toast('같은 상품의 일련번호가 이미 반품 목록에 있습니다.');return}if(mode==='serial'&&qty!==1){toast('일련번호 반품은 포장 단위 1개씩 등록하세요. 여러 포장은 각각 스캔하세요.');return}records.unshift({id:'R'+Date.now(),product:result.rows[0]?.product,gtin:result.gtin,lot:result.lot,serial:mode==='serial'?result.serial:'',vendor:selected,qty,reason:$('#reason').value,memo:$('#memo').value,status:'작성 중',match:mode==='serial'?'일련번호':mode==='lot'?'제조번호 후보':'상품코드 후보',date:new Date().toLocaleDateString('sv-SE'),demo:result.demo});save();closeModal();toast('반품 목록에 저장했습니다.');nav('returns')}
function closeModal(){$('#modal').innerHTML=''}
function returnView(){const shown=records.filter(r=>(!filter||r.status===filter)&&[r.product,r.vendor,r.lot,r.serial].some(s=>String(s).toLowerCase().includes(query.toLowerCase())));return `<div class="head"><div><h1>반품 관리</h1><p class="muted">모바일에서 등록한 반품을 도매상별로 확인하세요.</p></div><button class="primary" onclick="nav('scan')">+ 반품 등록</button></div><div class="cards">${[['전체 반품',records.length,'건'],['작성 중',records.filter(r=>r.status==='작성 중').length,'건'],['검토 대기',records.filter(r=>r.status==='검토 대기').length,'건'],['반품 수량',records.reduce((a,r)=>a+r.qty,0),'개']].map(([l,n,u])=>`<div class="card stat"><span class="small muted">${l}</span><strong>${n}<span class="small muted"> ${u}</span></strong><span class="small muted">이 브라우저의 저장 내역</span></div>`).join('')}</div><div class="card"><div class="sectiontitle"><h2>반품 목록</h2><button onclick="exportCSV()">CSV 내보내기</button></div><div class="toolbar"><input aria-label="반품 검색" placeholder="약품명, 도매상, 제조·일련번호 검색" value="${esc(query)}" oninput="query=this.value;refreshTable()"><select aria-label="상태 필터" onchange="filter=this.value;refreshTable()"><option value="">전체 상태</option>${['작성 중','검토 대기','시연 접수'].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="returntable">${returnTable(shown)}</div><p class="note">시연 접수는 예시 상태입니다. 실제 반품 가능 여부·접수·정산은 도매상 확인이 필요합니다. 저장 내역은 기기 간 자동 동기화되지 않습니다.</p></div>`}
function returnTable(rows){return `<div class="tablewrap"><table><thead><tr><th>약품명 / 제조번호</th><th>매입처</th><th>조회 방식</th><th>수량</th><th>반품 사유</th><th>상태</th><th>등록일</th><th>관리</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.product)}<br><span class="small muted">${esc(r.lot)}${r.serial?' · '+esc(r.serial):''}</span></td><td>${esc(r.vendor)}</td><td><span class="badge ${r.match.includes('후보')?'amber':''}">${esc(r.match)}</span></td><td>${r.qty}개</td><td>${esc(r.reason)}</td><td><span class="badge ${r.status==='작성 중'?'gray':r.status==='검토 대기'?'amber':''}">${r.status}</span></td><td>${r.date}</td><td><button onclick="editDialog('${r.id}')">수정</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">조건에 맞는 반품이 없습니다.</div>'}</div>`}
function refreshTable(){$('#returntable').innerHTML=returnTable(records.filter(r=>(!filter||r.status===filter)&&[r.product,r.vendor,r.lot,r.serial].some(s=>String(s).toLowerCase().includes(query.toLowerCase()))))}
function editDialog(id){const r=records.find(r=>r.id===id);$('#modal').innerHTML=`<div class="dialog"><div class="card"><div class="sectiontitle"><h2>반품 상세 · 수정</h2><button onclick="closeModal()" aria-label="닫기">×</button></div><p><b>${esc(r.product)}</b><br>${esc(r.vendor)} · ${esc(r.match)}</p><form onsubmit="event.preventDefault();updateReturn('${id}')"><label>수량</label><input id="editqty" type="number" min="1" step="1" value="${r.qty}" required><label>상태</label><select id="editstatus">${['작성 중','검토 대기','시연 접수'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select><label>메모</label><textarea id="editmemo">${esc(r.memo||'')}</textarea><p class="note">상태 변경은 시연용이며 도매상으로 전송되지 않습니다.</p><div class="actionbar"><button type="button" onclick="deleteReturn('${id}')">삭제</button><button class="primary">저장</button></div></form></div></div>`}function updateReturn(id){const r=records.find(r=>r.id===id),qty=Number($('#editqty').value);if(!Number.isInteger(qty)||qty<1||(r.match==='일련번호'&&qty!==1)){toast('일련번호 등록은 1개씩, 제조번호 등록은 양의 정수로 입력하세요.');return}Object.assign(r,{qty,status:$('#editstatus').value,memo:$('#editmemo').value});save();closeModal();render();toast('수정 내용을 저장했습니다.')}function deleteReturn(id){if(!confirm('이 반품 내역을 삭제할까요?'))return;records=records.filter(r=>r.id!==id);save();closeModal();render();toast('삭제했습니다.')}
function vendorView(){const vendors=[...new Set(records.map(r=>r.vendor))];return `<div class="head"><div><h1>도매상별 현황</h1><p class="muted">반품처별 수량과 검토할 내역을 확인합니다.</p></div><button onclick="exportCSV()">목록 내보내기</button></div><div class="integration">${vendors.map(v=>{const rs=records.filter(r=>r.vendor===v);return `<div class="card"><div class="sectiontitle"><h2>${esc(v)}</h2><span class="badge gray">${rs.length}건</span></div><strong style="font-size:32px">${rs.reduce((a,r)=>a+r.qty,0)}<span class="small muted"> 개</span></strong><div class="progress"><i style="width:${rs.filter(r=>r.status!=='작성 중').length/rs.length*100}%"></i></div><div class="flex between small"><span>작성 중 ${rs.filter(r=>r.status==='작성 중').length}건</span><span>검토 대기 ${rs.filter(r=>r.status==='검토 대기').length}건</span></div><p class="small muted">제조번호 후보 ${rs.filter(r=>r.match.includes('후보')).length}건 · 선택한 반품처 기준</p><button onclick="query='${esc(v)}';filter='';nav('returns')">반품 내역 보기</button></div>`}).join('')}</div>`}
function connectView(){return `<div class="head"><div><h1>매입내역 연동</h1><p class="muted">우리 약국의 매입기록을 기준으로 반품처를 찾습니다.</p></div><span class="badge amber">실서비스 연결 준비</span></div><div class="integration"><div class="card"><div class="sectiontitle"><h2>동원약품그룹 일련번호 API</h2><span class="badge gray">미연결</span></div><p class="muted small">동원약품 · 동원아이팜 · 아이팜코리아 등 도매상 매입내역과 일련번호를 비교합니다.</p><div class="infobox">연동 시 약국 식별자 + 상품코드 + 일련번호로 조회하고, 공급일자·제조번호·매입수량을 확인합니다. API 인증과 약국별 접근 권한이 필요합니다.</div><button style="margin-top:18px" onclick="apiSpec()">연동 항목 보기</button></div><div class="card"><div class="sectiontitle"><h2>KPIS 공급내역 / 공동인증서</h2><span class="badge gray">미연결</span></div><p class="muted small">공급내역 확보 후 상품코드·제조번호를 비교해 매입한 도매상 후보를 표시합니다.</p><div class="infobox warn">공동인증서 등록만으로 자동 조회가 되는 기능은 아직 연결되지 않았습니다. 공식 이용 권한·제공 항목·허용된 연계 방식 확인 후 구현합니다.</div><p class="note">이 시연 사이트는 인증서 파일이나 비밀번호를 수집하지 않습니다.</p><a href="https://biz.kpis.or.kr" target="_blank" rel="noopener">의약품정보포털 확인</a></div></div><div class="card" style="margin-top:24px"><div class="sectiontitle"><h2>매입내역 CSV 가져오기</h2><span class="badge">${imports.length}건 저장</span></div><p class="small muted">한 약국의 매입내역 파일을 가져오세요. 데이터는 이 브라우저에만 저장됩니다. 기존 업로드 기록을 대체하며 시연 반품 목록에는 영향을 주지 않습니다.</p><div class="flex"><button onclick="downloadTemplate()">CSV 양식 다운로드</button><input type="file" id="csvfile" accept=".csv" aria-label="CSV 매입내역 선택" style="width:auto;max-width:100%" onchange="importCSV(this.files[0])"><button onclick="clearImports()">가져온 기록 삭제</button></div><div class="infobox">필수 열: 상품코드, 도매상, 약품명, 공급일자, 매입수량<br>선택 열: 제조번호, 일련번호 · UTF-8 CSV / 번호 열은 텍스트 형식 권장</div></div><div class="card" style="margin-top:24px"><h2>최근 조회 기록</h2><div class="tablewrap"><table><thead><tr><th>조회일시</th><th>상품코드</th><th>제조번호</th><th>조회 방식</th><th>매입처 수</th></tr></thead><tbody>${history.slice(0,15).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.gtin)}</td><td>${esc(r.lot)}</td><td>${r.mode==='serial'?'일련번호':r.mode==='lot'?'제조번호':'상품코드'}</td><td>${r.count}곳</td></tr>`).join('')}</tbody></table>${history.length?'':'<div class="empty">아직 조회 기록이 없습니다.</div>'}</div></div>`}

function download(name,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csvCell(s){s=String(s??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}function downloadTemplate(){download('매입내역_시연양식.csv','상품코드,제조번호,일련번호,도매상,약품명,공급일자,매입수량\r\n08801234567890,DW260901,DW0000001024,동원약품,시연정 10mg · 30정,2026-09-24,10\r\n08801234567890,DW260901,,동원아이팜,시연정 10mg · 30정,2026-09-12,5')}function exportCSV(){const rows=records.filter(r=>(!filter||r.status===filter)&&[r.product,r.vendor,r.lot,r.serial].some(s=>String(s).includes(query)));download('반품목록.csv',[['등록번호','약품명','상품코드','제조번호','일련번호','도매상','수량','사유','상태','조회방식','등록일','메모'],...rows.map(r=>[r.id,r.product,r.gtin,r.lot,r.serial,r.vendor,r.qty,r.reason,r.status,r.match,r.date,r.memo])].map(r=>r.map(csvCell).join(',')).join('\r\n'));toast('반품 목록을 다운로드했습니다.')}

async function getCameraPermission(){try{if(!navigator.permissions?.query)return 'unknown';if(!cameraPermissionStatus){cameraPermissionStatus=await navigator.permissions.query({name:'camera'});cameraPermissionStatus.addEventListener('change',()=>{if(page!=='scan')return;if(cameraPermissionStatus.state==='granted'){const help=$('#cameraPermissionHelp');if(help)$('#modal').innerHTML='';if(!camera&&!cameraStarting)startCamera(true)}else if(cameraPermissionStatus.state==='denied'){stopCamera();showCameraBlocked()}})}return cameraPermissionStatus.state}catch{return 'unknown'}}
function showCameraBlocked(){cameraMessage('카메라가 차단되어 있습니다. 아래 버튼에서 허용 방법을 확인하세요.','카메라 권한 차단');const button=$('#cameraRetry');if(button){button.hidden=false;button.textContent='카메라 권한 허용 방법'}}
function cameraPermissionHelp(){const mobile=usesMobileCamera();$('#modal').innerHTML=`<div class="dialog" id="cameraPermissionHelp"><section class="card" role="dialog" aria-modal="true" aria-labelledby="permissionTitle"><h2 id="permissionTitle">카메라 차단 해제하기</h2><p>브라우저에 저장된 차단은 사이트에서 해제할 수 없어 허용 창이 다시 나오지 않을 수 있습니다.</p><ol class="permissionSteps"><li>주소창 옆의 <b>사이트 설정 아이콘(자물쇠·조절 버튼)</b>을 누르세요.</li><li><b>카메라 → 허용</b>으로 변경하세요. 항목이 없으면 사이트 설정에서 카메라 권한을 초기화하세요.</li><li>이 화면으로 돌아와 <b>허용 후 다시 연결</b>을 누르세요.</li></ol><p class="note">${mobile?'앱 안에서 열었다면 Chrome 또는 Safari 등 외부 브라우저로 열어 다시 허용해 보세요.':'계속 차단되면 Windows 설정 → 개인정보 및 보안 → 카메라에서 브라우저의 카메라 접근도 확인하세요.'}</p><p class="note">설정을 바꿔도 연결되지 않으면 페이지를 새로고침하세요.</p><div class="flex"><button onclick="document.querySelector('#modal').innerHTML=''">닫기</button><button class="primary" onclick="retryCameraPermission(true)">허용 후 다시 연결</button></div><p id="permissionCheck" role="status"></p></section></div>`}
async function retryCameraPermission(fromHelp=false){const permission=await getCameraPermission();if(permission==='denied'){showCameraBlocked();if(!fromHelp)cameraPermissionHelp();else $('#permissionCheck').textContent='아직 차단 상태입니다. 주소창의 사이트 설정에서 카메라를 허용해주세요.';return}if(fromHelp)$('#modal').innerHTML='';stopCamera();startCamera(true)}
window.addEventListener('focus',async()=>{if(page==='scan'&&!camera&&!cameraStarting&&(await getCameraPermission())==='granted')startCamera(true)});
async function startCamera(retry=false,deviceId=''){if(page!=='scan'||document.hidden||camera||cameraStarting)return;cameraStarting=true;if(!deviceId&&!usesMobileCamera())deviceId=localStorage.getItem('rl-pc-camera')||'';const epoch=++cameraEpoch,video=$('#video'),retryButton=$('#cameraRetry');if(retryButton){retryButton.hidden=true;retryButton.textContent='카메라 다시 연결'}cameraMessage('카메라 권한을 허용하고 바코드를 비춰주세요.','연결 중');let media;try{const permission=await getCameraPermission();if(epoch!==cameraEpoch)return;if(permission==='denied'){cameraStarting=false;showCameraBlocked();return}if(!navigator.mediaDevices?.getUserMedia)throw Error('카메라를 사용할 수 없는 브라우저입니다. 직접 입력하세요.');media=await navigator.mediaDevices.getUserMedia({audio:false,video:{...(deviceId?{deviceId:{exact:deviceId}}:(usesMobileCamera()?{facingMode:{ideal:'environment'}}:{})),width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:60}}});if(epoch!==cameraEpoch||page!=='scan'){media.getTracks().forEach(t=>t.stop());return}video.srcObject=media;camera={stop(){media.getTracks().forEach(t=>t.stop())}};cameraTrack=media.getVideoTracks()[0];await video.play();if(epoch!==cameraEpoch)return;const caps=cameraTrack.getCapabilities?.()||{};if(caps.focusMode?.includes('continuous'))try{await cameraTrack.applyConstraints({focusMode:{exact:'continuous'}})}catch{};if(caps.exposureMode?.includes('continuous'))try{await cameraTrack.applyConstraints({exposureMode:{exact:'continuous'}})}catch{};cameraDevices=(await navigator.mediaDevices.enumerateDevices().catch(()=>[])).filter(d=>d.kind==='videoinput');if(epoch!==cameraEpoch){media.getTracks().forEach(t=>t.stop());return}const rear=cameraDevices.filter(d=>/back|rear|후면|environment/i.test(d.label)&&!/front|user|전면|selfie/i.test(d.label));if(usesMobileCamera()&&rear.length)cameraDevices=rear;cameraDeviceIndex=Math.max(0,cameraDevices.findIndex(d=>d.deviceId===cameraTrack.getSettings().deviceId));if(usesMobileCamera()&&!deviceId){const rank=d=>(/ultra|초광각|telephoto|망원/i.test(d.label)?-20:0)+(/main|wide angle|기본|메인|camera2? 0\b/i.test(d.label)?10:0);const current=cameraDevices.find(d=>d.deviceId===cameraTrack.getSettings().deviceId),preferred=[...rear].sort((a,b)=>rank(b)-rank(a))[0];if(preferred&&current&&rank(preferred)>rank(current)){stopCamera();startCamera(true,preferred.deviceId);return}}configureCameraTools(caps);scanCanvas=document.createElement('canvas');scanContext=scanCanvas.getContext('2d',{willReadFrequently:true});if(window.BarcodeDetector){try{const supported=await BarcodeDetector.getSupportedFormats();const formats=['ean_13','ean_8','upc_a','upc_e','code_128','itf','data_matrix','qr_code'].filter(f=>supported.includes(f));if(formats.length)nativeDetector=new BarcodeDetector({formats})}catch{}}if(epoch!==cameraEpoch){media.getTracks().forEach(t=>t.stop());return}prepareDecoder(epoch);cameraStarting=false;cameraMessage('바코드를 중앙에 비춰주세요. 흐리면 바코드를 터치해 초점을 다시 요청하세요.','1D · 2D 자동 인식');scanLoop(epoch)}catch(e){if(epoch!==cameraEpoch){media?.getTracks().forEach(t=>t.stop());return}cameraStarting=false;media?.getTracks().forEach(t=>t.stop());camera=null;if(e.name==='NotAllowedError'||e.name==='SecurityError'){showCameraBlocked();return}if(deviceId&&!usesMobileCamera()&&(e.name==='OverconstrainedError'||e.name==='NotFoundError')){localStorage.removeItem('rl-pc-camera');startCamera(true);return}const msg=e.name==='NotAllowedError'?'브라우저 설정에서 카메라 권한을 허용하세요.':e.name==='NotFoundError'?'카메라를 찾지 못했습니다. 직접 입력하세요.':e.name==='NotReadableError'?'다른 앱의 카메라 사용을 종료한 뒤 다시 연결하세요.':e.message;cameraMessage(msg,'카메라 연결 실패');if(retryButton)retryButton.hidden=false;toast(msg)}}
function configureCameraTools(caps){const box=$('#cameraTools');if(!box)return;box.innerHTML=`<button type="button" onclick="focusCamera()">초점</button>${caps.torch?'<button type="button" onclick="toggleTorch()" id="torchButton">조명</button>':''}${caps.zoom?'<button type="button" onclick="cycleZoom()" id="zoomButton">1×</button>':''}${usesMobileCamera()?(cameraDevices.length>1?'<button type="button" onclick="switchCamera()">렌즈 변경</button>':''):'<label class="cameraSelectLabel">카메라 <select id="cameraSelect" aria-label="PC 카메라 선택" onchange="selectCamera(this.value)">'+cameraDevices.map((d,i)=>'<option value="'+esc(d.deviceId)+'" '+(d.deviceId===cameraTrack.getSettings().deviceId?'selected':'')+'>'+esc(d.label||'카메라 '+(i+1))+'</option>').join('')+'</select></label>'}`;const zoom=$('#zoomButton');if(zoom)zoom.textContent=Number(cameraTrack.getSettings().zoom||1).toFixed(1)+'×'}
async function toggleTorch(){if(!cameraTrack)return;try{await cameraTrack.applyConstraints({advanced:[{torch:!torchOn}]});torchOn=!torchOn;$('#torchButton').textContent=torchOn?'조명 끄기':'조명'}catch{toast('이 카메라에서 조명을 변경할 수 없습니다.')}}
async function cycleZoom(){if(!cameraTrack)return;const caps=cameraTrack.getCapabilities().zoom;if(!caps)return;const current=cameraTrack.getSettings().zoom||1,levels=[1,1.5,2,3].filter(n=>n>=caps.min&&n<=caps.max);if(!levels.length)return;const next=levels.find(n=>n>current+.1)||levels[0];try{await cameraTrack.applyConstraints({advanced:[{zoom:next}]});$('#zoomButton').textContent=next+'×'}catch{toast('확대를 변경할 수 없습니다.')}}
async function focusCamera(event){
 if(!cameraTrack||focusBusy||scanOverlayOpen)return;
 const track=cameraTrack,epoch=cameraEpoch,caps=track.getCapabilities?.()||{},video=$('#video'),rect=video.getBoundingClientRect();
 const x=Math.max(0,Math.min(1,event?(event.clientX-rect.left)/rect.width:.5)),y=Math.max(0,Math.min(1,event?(event.clientY-rect.top)/rect.height:.5));
 const box=video.parentElement;box.querySelector('.focusRing')?.remove();const ring=document.createElement('span');ring.className='focusRing';ring.style.left=(x*rect.width+video.offsetLeft)+'px';ring.style.top=(y*rect.height+video.offsetTop)+'px';box.appendChild(ring);setTimeout(()=>ring.remove(),1200);
 const supported=navigator.mediaDevices.getSupportedConstraints?.()||{},constraints={};
 if(caps.focusMode?.includes('single-shot'))constraints.focusMode={exact:'single-shot'};else if(caps.focusMode?.includes('continuous'))constraints.focusMode={exact:'continuous'};
 if(supported.pointsOfInterest){const vw=video.videoWidth,vh=video.videoHeight,scale=Math.max(rect.width/vw,rect.height/vh);constraints.pointsOfInterest=[{x:(x*rect.width+(vw*scale-rect.width)/2)/(vw*scale),y:(y*rect.height+(vh*scale-rect.height)/2)/(vh*scale)}]}
 if(!Object.keys(constraints).length){cameraMessage('이 브라우저는 초점 제어를 지원하지 않습니다. 렌즈 변경을 시도해주세요.','초점 제어 미지원');return}
 focusBusy=true;try{await track.applyConstraints(constraints);if(epoch!==cameraEpoch)return;cameraMessage('초점을 다시 요청했습니다. 선명해지면 자동으로 인식합니다.','초점 재요청');clearTimeout(focusTimer);focusTimer=setTimeout(async()=>{if(epoch!==cameraEpoch||cameraTrack!==track)return;try{if(caps.focusMode?.includes('continuous'))await track.applyConstraints({focusMode:{exact:'continuous'}})}catch{}},900)}catch{if(epoch===cameraEpoch)cameraMessage('초점 요청을 적용하지 못했습니다. 렌즈 변경을 시도해주세요.','초점 요청 실패')}finally{if(epoch===cameraEpoch)focusBusy=false}
}
function selectCamera(deviceId){if(!deviceId||cameraStarting||deviceId===cameraTrack?.getSettings().deviceId)return;if(!usesMobileCamera())localStorage.setItem('rl-pc-camera',deviceId);stopCamera();startCamera(true,deviceId)}
function switchCamera(){if(cameraDevices.length<2)return;const next=cameraDevices[(cameraDeviceIndex+1)%cameraDevices.length].deviceId;stopCamera();startCamera(true,next)}
function stopCamera(){cameraEpoch++;cameraStarting=false;focusBusy=false;clearTimeout(focusTimer);clearTimeout(scanTimer);scanTimer=null;decoderWorker?.terminate();decoderWorker=null;decoderReady=false;workerBusy=false;mainDecoder=null;nativeDetector=null;nativeBusy=false;nativeLast=0;cameraTrack=null;torchOn=false;if(camera){camera.stop();camera=null}const video=$('#video');if(video?.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}clearTimeout(rawTimer)}
if(typeof window.matchMedia==='function'){window.matchMedia('(max-width: 700px)').addEventListener('change',()=>{stopCamera();render()})}window.addEventListener('pagehide',stopCamera);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera();else if(page==='scan')startCamera()});render();
</script></body></html>
